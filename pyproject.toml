[project]
name = "certificate-expiration"
version = "0.1.0"
description = "Track iOS certificate expiration dates with Google Calendar and Telegram notifications"
authors = [{name = "Mohit Nalavadi"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests",
    "rich",
    "google-auth",
    "google-api-python-client",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "black",
    "jupyter>=1.1.1",
    "notebook>=7.6.3",
    "pandas>=3.0.6",
    "ruff>=0.17.0",
    "typer>=0.27.3",
    "python-dotenv>=1.2.4",
]

[tool.config]
# File paths
calendar_file = "app_calendar_events.json"
google_creds_file = "google_application_credentials.json"

[project.scripts]
cert-exp = "src.main:main"
config = "src.config:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 110
target-version = ['py312']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-s -v --cov=src --cov-report=term-missing"

[tool.coverage.run]
omit = ["tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.uv]
exclude-newer = "1 week"
exclude-newer-package = { certifi = false }

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF100", "PLW1510"]
ignore = ["E501", "B008", "UP042"]

[tool.ruff.lint.isort]
force-single-line = true
